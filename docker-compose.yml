services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    environment:
      NODE_ENV: "production"
